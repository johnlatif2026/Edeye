<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#f4f4f4;
  padding:10px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
h2{
  margin:0;
}
.logout{
  padding:8px 12px;
  background:#f44336;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}
.logout:hover{
  background:#d32f2f;
}
.cards-container{
  display:grid;
  gap:15px;
  grid-template-columns:1fr 1fr;
}
.card{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  position:relative;
  transition:0.3s;
}
.card p{
  margin:5px 0;
  font-size:14px;
  word-break: break-word;
}
.delete-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:#ff4d4d;
  border:none;
  padding:5px 8px;
  border-radius:6px;
  color:white;
  cursor:pointer;
  font-size:12px;
  transition:0.3s;
}
.delete-btn:hover{
  background:#e60000;
}
@media(max-width:500px){
  .cards-container{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="top">
  <h2>طلبات العيدية</h2>
  <button class="logout" onclick="logout()">تسجيل خروج</button>
</div>

<div class="cards-container" id="list"></div>

<script>
async function load(){
  const token=localStorage.getItem("token");
  if(!token){location.href="/login";return;}
  
  const res=await fetch("/api/requests",{headers:{Authorization:token}});
  if(res.status!==200){location.href="/login";return;}
  
  const data=await res.json();
  const list=document.getElementById("list");
  list.innerHTML=data.map((r,i)=>`
    <div class="card">
      <p><b>${r.name}</b></p>
      <p>النوع: ${r.type}</p>
      <p>الرقم: ${r.phone}</p>
      <p>${r.time}</p>
      <button class="delete-btn" onclick="del(${i})">حذف</button>
    </div>
  `).join("");
}

async function del(i){
  const token=localStorage.getItem("token");
  await fetch("/api/delete/"+i,{method:"DELETE",headers:{Authorization:token}});
  load();
}

function logout(){
  localStorage.removeItem("token");
  location.href="/login";
}

load();
</script>

</body>
</html>
