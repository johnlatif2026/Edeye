<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eidety</title>
<link rel="icon" href="https://i.postimg.cc/Nj83FS93/Eidety.jpg">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:95%;
  max-width:500px;
  background:rgba(255,255,255,0.05);
  border-radius:25px;
  padding:30px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
  width:120px;
  border-radius:20px;
  margin-bottom:15px;
}

.alert{
  background:rgba(0,0,0,0.6);
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
}

input,button{
  width:100%;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  border:none;
  font-size:16px;
}

button{
  background:#00c9a7;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:20px;
}

.card{
  background:white;
  color:#333;
  padding:30px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
  font-size:40px;
  transition:0.4s;
}

.card:hover{
  transform:scale(1.1) rotate(5deg);
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<img class="logo" src="https://i.postimg.cc/Nj83FS93/Eidety.jpg">

<h2>خريستوس انيستي</h2>
<h3>Χριστός ἀνέστη</h3>

<div id="alert" class="alert hidden">انت حولت قبل كده 😅</div>

<!-- STEP 1 -->
<div id="step1">
  <input id="name" placeholder="اكتب اسمك">
  <button id="enterBtn" onclick="enter()">دخول</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="hidden">
  <div class="cards" id="cards"></div>
</div>

<!-- RESULT -->
<div id="result"></div>

</div>

<script>

let selectedType=null;

const boxes=[
{label:"هتاخد 50",type:"take",amount:50},
{label:"هتدي 50",type:"give",amount:50,phone:"01274445091"},
{label:"هتاخد 100",type:"take",amount:100},
{label:"هتدي 100",type:"give",amount:100,phone:"01274445091"}
];

// عند فتح الصفحة
window.onload=function(){

if(localStorage.getItem("sent")){

document.getElementById("alert").classList.remove("hidden");

document.getElementById("name").disabled=true;
document.getElementById("enterBtn").disabled=true;

}

}

// دخول
function enter(){

if(localStorage.getItem("sent")) return;

const n=document.getElementById("name").value.trim();

if(!n){
alert("اكتب اسمك");
return;
}

document.getElementById("step1").classList.add("hidden");
document.getElementById("step2").classList.remove("hidden");

showCards();

}

// عرض البوكسات
function showCards(){

const shuffled = boxes.sort(()=>0.5-Math.random());

const container = document.getElementById("cards");
container.innerHTML = "";

shuffled.forEach((b)=>{

const div = document.createElement("div");
div.className = "card";

// شكل الهدية
div.innerHTML = "🎁";

div.onclick = ()=>{
openCard(div, b);
};

container.appendChild(div);

});

}

// فتح البوكس
function openCard(element, box){

if(localStorage.getItem("sent")) return;

element.innerHTML = `<p style="font-size:18px">${box.label}</p>`;
element.style.background = "#ffeaa7";

element.onclick = null;

setTimeout(()=>{
choose(box);
},800);

}

// اختيار
function choose(box){

if(localStorage.getItem("sent")) return;

selectedType=box;

document.getElementById("cards").innerHTML="";

if(box.type==="give"){

send(box.phone);

}else{

document.getElementById("result").innerHTML=`
<input id="phone" placeholder="رقمك">
<button onclick="send()">ارسال</button>
`;

}

}

// ارسال
async function send(phoneNumber){

if(localStorage.getItem("sent")) return;

const phone=phoneNumber||document.getElementById("phone").value.trim();

const res = await fetch("/api/request",{

method:"POST",
headers:{"Content-Type":"application/json"},

body:JSON.stringify({
name:document.getElementById("name").value,
type:selectedType.type,
amount:selectedType.amount,
phone:phone
})

});

if(res.ok){

localStorage.setItem("sent",true);

document.getElementById("alert").classList.remove("hidden");
document.getElementById("result").innerHTML="<h2>تم الإرسال 🎉</h2>";

}

}

</script>

</body>
</html>
