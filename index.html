<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eidety</title>
<link rel="icon" href="https://i.postimg.cc/Nj83FS93/Eidety.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

/* body */
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow-x:hidden;
  transition:background 1s;
}

/* container أكبر */
.container{
  width:95%;
  max-width:500px;
  background:rgba(255,255,255,0.05);
  border-radius:25px;
  padding:30px 20px 40px 20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* لوغو أكبر */
.logo{
  width:120px;
  border-radius:20px;
  margin-bottom:20px;
  border:2px solid rgba(255,255,255,0.5);
}

/* alerts */
.alert-sent{
  background:rgba(0,0,0,0.6);
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
  font-size:16px;
}

/* input & button */
input,button{
  width:100%;
  padding:16px;
  margin:10px 0;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  background:#00c9a7;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  background:#00b38f;
}

/* Cards */
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:25px;
}
.card{
  background:white;
  color:#333;
  padding:25px;
  border-radius:20px;
  cursor:pointer;
  transition:0.4s;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:16px;
  flex-direction:column;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}
.card:hover{
  transform:scale(1.07);
  box-shadow:0 12px 25px rgba(0,0,0,0.35);
}
.fade-out{
  opacity:0;
  transform:scale(0.8);
  transition:0.4s;
}
.expand{
  transform:scale(1.15);
  transition:0.4s;
}
#result{
  margin-top:25px;
  text-align:center;
}
@media(max-width:450px){
  .cards{
    grid-template-columns:1fr;
  }
  .card{
    font-size:18px;
    padding:20px;
  }
  .container{
    padding:25px 15px 30px 15px;
  }
  .logo{
    width:100px;
  }
}
</style>
</head>
<body>

<div class="container">
<img class="logo" src="https://i.postimg.cc/Nj83FS93/Eidety.jpg">
<h2>Eidety</h2>

<div id="alert-sent" class="alert-sent hidden">انت بعت قبل كده 😅</div>

<!-- STEP 1 -->
<div id="step1">
  <input id="name" placeholder="اكتب اسمك">
  <button onclick="enter()">دخول</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="hidden">
  <div class="cards" id="cards">
    <div class="card" onclick="choose('take',this)">
      <p>عديتك هتاخد 50 جنيه</p>
    </div>
    <div class="card" onclick="choose('give',this)">
      <p>عديتك هتدي 50 جنيه</p>
    </div>
    <div class="card" onclick="choose('take',this)">
      <p>عديتك هتدي 50 جنيه</p>
    </div>
    <div class="card" onclick="choose('give',this)">
      <p>عديتك هتاخد 50 جنيه</p>
    </div>
  </div>
</div>

<!-- STEP 3 -->
<div id="result"></div>

</div>

<script>
let selectedType=null;

// عند تحميل الصفحة نتحقق هل المستخدم سبق وأرسل
window.onload = ()=>{
  if(localStorage.getItem("sent")){
    document.getElementById("alert-sent").classList.remove("hidden");
  }
}

// الدخول
function enter(){
  const n = document.getElementById("name").value.trim();
  if(!n){
    alert("من فضلك ادخل الاسم");
    return;
  }
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

// اختيار البوكس
function choose(type,el){
  selectedType=type;
  const cards=document.querySelectorAll(".card");
  cards.forEach(c=>{
    if(c!==el){
      c.classList.add("fade-out");
      setTimeout(()=>c.style.display="none",400);
    } else {
      c.classList.add("expand");
    }
  });

  if(type==="give"){
    // ارسال مباشر بدون رقم
    send();
  } else {
    setTimeout(()=>openCard(type),500);
  }
}

function openCard(type){
  let html=`<input id="phone" placeholder="رقمك"><button onclick="send()">إرسال</button>`;
  document.getElementById("result").innerHTML=html;
}

// ارسال البيانات
async function send(){
  if(localStorage.getItem("sent")){
    document.getElementById("alert-sent").classList.remove("hidden");
    return;
  }
  const res = await fetch("/api/request",{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body:JSON.stringify({
      name:document.getElementById("name").value,
      type:selectedType,
      phone:document.getElementById("phone")?.value || "-"
    })
  });
  if(res.ok){
    localStorage.setItem("sent",true);
    document.getElementById("alert-sent").classList.remove("hidden");
    document.getElementById("result").innerHTML="<h2>تم الإرسال بنجاح</h2>";
  }
}

// تغيير الخلفية عشوائي
setInterval(()=>{
  const colors=[
    "linear-gradient(135deg,#667eea,#764ba2)",
    "linear-gradient(135deg,#ff758c,#ff7eb3)",
    "linear-gradient(135deg,#43cea2,#185a9d)"
  ];
  document.body.style.background=colors[Math.floor(Math.random()*colors.length)];
},5000);

</script>

</body>
</html>
