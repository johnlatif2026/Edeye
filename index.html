<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>العيدية</title>

<!-- favicon -->
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<style>
body {
  margin:0;
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

.container {
  max-width:400px;
  margin:auto;
  padding:30px;
}

.logo {
  width:80px;
  margin-bottom:10px;
}

.hidden { display:none; }

input {
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin-top:10px;
}

button {
  margin-top:10px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:8px;
  background:#00c9a7;
  color:white;
  cursor:pointer;
}

.cards {
  display:flex;
  flex-direction:column;
  gap:15px;
  margin-top:20px;
}

.card {
  background:white;
  color:#333;
  padding:20px;
  border-radius:15px;
  cursor:pointer;
  transition:0.4s;
  transform:scale(1);
}

.card:hover {
  transform:scale(1.05);
}

.fade-out {
  opacity:0;
  transform:scale(0.8);
}

.expand {
  transform:scale(1.1);
}

</style>
</head>

<body>

<div class="container">

<img class="logo" src="https://cdn-icons-png.flaticon.com/512/942/942748.png">

<h2>🎉 العيدية</h2>

<!-- STEP 1 -->
<div id="step1">
  <input id="name" placeholder="اكتب اسمك">
  <button onclick="enter()">دخول</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="hidden">
  <div class="cards" id="cards">
    <div class="card" onclick="choose('take',this)">
      🎁 عديتك آخذ 50 جنيه
    </div>

    <div class="card" onclick="choose('give',this)">
      💸 عديتك أعطي 50 جنيه
    </div>
  </div>
</div>

<!-- STEP 3 -->
<div id="result"></div>

</div>

<script>
let selectedType=null;

function enter(){
  if(!name.value) return alert("اكتب اسمك");
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

// اختيار
function choose(type,el){
  selectedType=type;

  const cards=document.querySelectorAll(".card");

  cards.forEach(c=>{
    if(c!==el){
      c.classList.add("fade-out");
      setTimeout(()=>c.style.display="none",300);
    } else {
      c.classList.add("expand");
    }
  });

  setTimeout(()=>{
    openCard(type);
  },400);
}

function openCard(type){
  let html="";

  if(type==="take"){
    html=`
      <input id="phone" placeholder="رقمك">
      <button onclick="send()">إرسال</button>
    `;
  }else{
    html=`
      <h3>حول على الرقم 👇</h3>
      <p style="font-size:20px">01000000000</p>
      <button onclick="send()">تم</button>
    `;
  }

  document.getElementById("result").innerHTML=html;
}

// إرسال
async function send(){
  if(localStorage.getItem("sent")){
    alert("أنت أرسلت قبل كده 😅");
    return;
  }

  const res = await fetch("/api/request",{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body:JSON.stringify({
      name:name.value,
      type:selectedType,
      phone:document.getElementById("phone")?.value || "-"
    })
  });

  if(res.ok){
    localStorage.setItem("sent",true);
    document.body.innerHTML="<h2>🎉 تم بنجاح</h2>";
  }
}

// 🎨 تغيير عشوائي للخلفية
setInterval(()=>{
  const colors=[
    "linear-gradient(135deg,#667eea,#764ba2)",
    "linear-gradient(135deg,#ff758c,#ff7eb3)",
    "linear-gradient(135deg,#43cea2,#185a9d)"
  ];
  document.body.style.background =
    colors[Math.floor(Math.random()*colors.length)];
},5000);

</script>

</body>
</html>
