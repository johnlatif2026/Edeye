<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eidety</title>
<link rel="icon" href="https://i.postimg.cc/Nj83FS93/Eidety.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

/* Body */
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  transition:background 1s;
}

/* Container */
.container{
  width:95%;
  max-width:500px;
  background:rgba(255,255,255,0.05);
  border-radius:25px;
  padding:30px 20px 40px 20px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* Logo */
.logo{
  width:120px;
  border-radius:20px;
  margin-bottom:15px;
  border:2px solid rgba(255,255,255,0.5);
}

/* Alert */
.alert-sent{
  background:rgba(0,0,0,0.6);
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-weight:bold;
  font-size:16px;
}

/* Inputs & Buttons */
input,button{
  width:100%;
  padding:16px;
  margin:10px 0;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  background:#00c9a7;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  background:#00b38f;
}

/* Cards */
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:25px;
}
.card{
  background:white;
  color:#333;
  padding:25px;
  border-radius:20px;
  cursor:pointer;
  transition:0.4s;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:16px;
  flex-direction:column;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
  opacity:0;
}
.card.show{
  opacity:1;
  transition:0.5s;
}
.card:hover{
  transform:scale(1.07);
  box-shadow:0 12px 25px rgba(0,0,0,0.35);
}

#result{
  margin-top:25px;
  text-align:center;
}

@media(max-width:450px){
  .cards{
    grid-template-columns:1fr;
  }
  .card{
    font-size:16px;
    padding:20px;
  }
  .container{
    padding:25px 15px 30px 15px;
  }
  .logo{
    width:100px;
  }
}
</style>
</head>
<body>

<div class="container">
<img class="logo" src="https://i.postimg.cc/Nj83FS93/Eidety.jpg">
<h2>خريستوس انيستي</h2>
<h3>Χριστός ἀνέστη</h3>

<div id="alert-sent" class="alert-sent hidden">انت حولت قبل كده 😅</div>

<!-- STEP 1 -->
<div id="step1">
  <input id="name" placeholder="اكتب اسمك">
  <button onclick="enter()">دخول</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="hidden">
  <div class="cards" id="cards"></div>
</div>

<!-- STEP 3 -->
<div id="result"></div>

</div>

<script>
let selectedType=null;
const boxes=[
  {label:"هتاخد 50", type:"take", amount:50},
  {label:"هتدي 50", type:"give", amount:50, phone:"01274445091"},
  {label:"هتاخد 100", type:"take", amount:100},
  {label:"هتدي 100", type:"give", amount:100, phone:"01274445091"}
];

// عند تحميل الصفحة
window.onload = ()=>{
  if(localStorage.getItem("sent")){
    document.getElementById("alert-sent").classList.remove("hidden");
  }
}

// الدخول
function enter(){
  const n = document.getElementById("name").value.trim();
  if(!n){alert("من فضلك ادخل الاسم"); return;}
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
  showCards();
}

// عرض البوكسات بشكل عشوائي
function showCards(){
  const shuffled = boxes.sort(()=>0.5-Math.random());
  const container=document.getElementById("cards");
  container.innerHTML="";
  shuffled.forEach((b,i)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<p>${b.label}</p>`;
    div.onclick=()=>choose(b);
    container.appendChild(div);
    setTimeout(()=>div.classList.add("show"),50*i);
  });
}

// اختيار
function choose(box){
  selectedType=box;
  const cards=document.querySelectorAll(".card");
  cards.forEach(c=>{c.style.display="none";});
  if(box.type==="give"){
    send(box.phone);
  } else {
    document.getElementById("result").innerHTML=
      `<input id="phone" placeholder="رقمك" maxlength="11">
       <button onclick="send()">إرسال</button>`;
  }
}

// ارسال البيانات
async function send(phoneNumber){
  if(localStorage.getItem("sent")){
    document.getElementById("alert-sent").classList.remove("hidden");
    return;
  }
  const phone = phoneNumber || document.getElementById("phone").value.trim();
  if(selectedType.type==="take"){
    if(phone.length<10 || phone.length>11){alert("الرقم يجب أن يكون 10-11 رقم"); return;}
  }
  const res = await fetch("/api/request",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:document.getElementById("name").value,
      type:selectedType.type,
      amount:selectedType.amount,
      phone:phone
    })
  });
  if(res.ok){
    localStorage.setItem("sent",true);
    document.getElementById("alert-sent").classList.remove("hidden");
    document.getElementById("result").innerHTML="<h2>تم الإرسال بنجاح 🎉</h2>";
  }
}

// تغيير الخلفية عشوائي
setInterval(()=>{
  const colors=[
    "linear-gradient(135deg,#667eea,#764ba2)",
    "linear-gradient(135deg,#ff758c,#ff7eb3)",
    "linear-gradient(135deg,#43cea2,#185a9d)"
  ];
  document.body.style.background=colors[Math.floor(Math.random()*colors.length)];
},5000);
</script>

</body>
</html>
